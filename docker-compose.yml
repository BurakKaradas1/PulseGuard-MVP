services:
  collector:
    build:
      context: ./pulseguard-collector
    container_name: pulseguard-collector
    env_file:
      - .env
    ports:
      - "8080:8080"
    environment:
      TZ: Europe/Istanbul
    volumes:
      - collector-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/api/v1/dashboard/hosts"]
      interval: 10s
      timeout: 3s
      retries: 5

  dashboard:
    build:
      context: ./pulseguard-dashboard
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8080}
    container_name: pulseguard-dashboard
    env_file:
      - .env
    ports:
      - "5173:80"
    depends_on:
      collector:
        condition: service_healthy
    restart: unless-stopped

volumes:
  collector-data: