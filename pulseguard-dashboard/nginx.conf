server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Single-page app fallback: unknown paths resolve to index.html
    # so client-side routing (if added later) keeps working.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Reasonable caching for static build assets.
    location ~* \.(js|css|svg|png|jpg|jpeg|gif|ico|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public, immutable";
    }
}
